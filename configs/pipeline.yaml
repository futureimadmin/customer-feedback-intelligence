pipeline:
  schema_version: "1.0"
  pipeline_version: "1.3.0"

  gcs:
    bucket: customer-feedback
    prefixes:
      raw: raw/
      raw_envelope: raw-envelope/
      normalized: curated/normalized/
      features: curated/features/
      classified: curated/classified/
      quarantine: quarantine/

  classification:
    confidence_threshold: 0.75
    review_queue_enabled: true
    auto_escalate_after_hours: 24

  models:
    classifier_endpoint_env: CLASSIFIER_ENDPOINT
    embedding_model: text-embedding-004
    anomaly_score_threshold: 0.8

  agentic_rag:
    vector_search_top_k: 8
    prompt_version: ticket-intel-v4.2
    gemini_model: gemini-2.0-flash-001

  bigquery:
    dataset: feedback_analytics
    tables:
      events: feedback_events
      tickets: ticket_lineage

  sla:
    stage_timeout_minutes: 30
    run_timeout_hours: 6
    heartbeat_interval_seconds: 60

  cost:
    daily_budget_usd: 50.0
    alert_threshold_pct: 80
    track_gemini: true
    track_vector_search: true
    track_training: true

  training:
    enabled: true
    max_samples: 5000
    promote_min_accuracy: 0.82
