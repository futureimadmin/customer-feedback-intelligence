apiVersion: v1
kind: Namespace
metadata:
  name: cfi-control-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: cfi-control-plane
  annotations:
    iam.gke.io/gcp-service-account: cfi-control-plane@intelligent-machines.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: cfi-control-plane
  labels:
    app: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          image: us-central1-docker.pkg.dev/intelligent-machines/cfi/control-plane:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: JIRA_TOOL_URL
              value: http://jira-tool.cfi-jira-tool.svc.cluster.local:8080
            - name: PIPELINE_CONFIG_PATH
              value: /config/pipeline.yaml
            - name: GCS_BUCKET
              value: customer-feedback
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: pipeline-config
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: cfi-control-plane
spec:
  selector:
    app: control-plane
  ports:
    - port: 8080
      targetPort: 8080
